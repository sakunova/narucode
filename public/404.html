<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – narucode | Strudel 日本語ハブ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1CAE;
      --bg-glow: #2f56ff;
      --accent: #ff7a1a;
      --text: #ffffff;
      --text-body: rgba(255,255,255,0.75);
      --text-muted: rgba(255,255,255,0.55);
      --text-dim: rgba(255,255,255,0.28);
      --border-subtle: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: fixed;
      top: -96px;
      right: -64px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: #2f56ff;
      opacity: 0.40;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      position: relative;
      z-index: 1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      flex-shrink: 0;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 6vw, 48px);
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .desc {
      font-size: 15px;
      color: var(--text-body);
      line-height: 1.7;
      max-width: 380px;
      margin-bottom: 40px;
    }
    .btn-primary {
      display: inline-block;
      background: #ffffff;
      color: #0B1CAE;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      height: 48px;
      line-height: 48px;
      padding: 0 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn-primary:hover {
      background: #ff7a1a;
      color: #ffffff;
    }
    footer {
      border-top: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.15);
    }
    footer p {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    footer a {
      color: var(--text-dim);
      text-decoration: none;
    }
    footer a:hover { color: var(--text-muted); }
  </style>
</head>
<body>
<div class="page">
  <div class="glow" aria-hidden="true"></div>

  <main class="main">
    <div class="pill" aria-label="エラーコード 404">
      <span class="pill-dot" aria-hidden="true"></span>
      404
    </div>
    <h1>ページが見つかりません</h1>
    <p class="desc">お探しのページは移動または削除された可能性があります。</p>
    <a href="https://narucode.tochino0707.workers.dev/" class="btn-primary">ハブへ戻る →</a>
  </main>

  <footer>
	    <p>
	      Strudel © TidalCycles contributors (AGPL-3.0-or-later) · 本サイトも AGPL-3.0 ·
	      <a href="https://strudel.cc" target="_blank" rel="noopener noreferrer">strudel.cc</a> ·
	      <a href="https://codeberg.org/uzu/strudel" target="_blank" rel="noopener noreferrer">Codeberg</a> ·
	      <a href="https://github.com/sakunova/narucode" target="_blank" rel="noopener noreferrer">ソース</a> ·
	      CDN: @strudel/repl@1.3.0 · 非公式 · 無保証
	    </p>
    <span style="font-size:10px; color:rgba(255,255,255,0.28); font-family:'Inter',sans-serif;">by sakunova</span>
  </footer>
</div>
</body>
</html>
