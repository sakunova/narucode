<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>narucode 速度チェック</title>
<style>
  /* 診断ページなので Web フォントも外部も一切使わない。
     これ自体が遅いと測定にならないため、依存はゼロにしてある。 */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 60px;
    background: #0B1CAE; color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: rgba(255,255,255,0.6); font-size: 12px; margin: 0 0 18px; }
  button {
    display: block; width: 100%; min-height: 52px; margin: 0 0 16px;
    border: 0; border-radius: 8px; background: #ff7a1a; color: #fff;
    font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  button[disabled] { opacity: 0.5; }
  button.sec { background: rgba(255,255,255,0.14); }
  pre {
    margin: 0 0 16px; padding: 12px;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  .hint { color: rgba(255,255,255,0.65); font-size: 13px; margin: 0 0 18px; }
  .big { font-size: 15px; font-weight: 700; }
</style>
</head>
<body>

<h1>narucode 速度チェック</h1>
<p class="sub">このページは診断専用。外部サーバーを一切使っていない。</p>

<pre id="self">計測中…</pre>

<button id="run" type="button">各ページの実測を開始</button>
<pre id="out">上のボタンを押すと、4ページとフォントを実際に取得して1つずつ時間を測ります。</pre>

<button id="runpaint" type="button">描画テストを開始（15秒ほど）</button>
<pre id="paint">ホームで使っているぼかし効果が、この端末でどれくらい重いかを実際に描画して測ります。</pre>

<button id="copy" class="sec" type="button">結果を全部コピー</button>
<p class="hint">コピーして貼り付けるか、スクリーンショットを送ってください。</p>

<script>
(function () {
  "use strict";

  var ms = function (v) { return v == null ? "-" : Math.round(v) + "ms"; };
  var kb = function (v) { return v ? (v / 1024).toFixed(1) + "KB" : "-"; };

  // --- このページ自身がどう読まれたか ---
  function selfReport() {
    var lines = [];
    var n = performance.getEntriesByType("navigation")[0];
    lines.push("== このページの読み込み ==");
    if (!n) { lines.push("Navigation Timing が取れない"); return lines.join("\n"); }
    lines.push("接続方式      : " + (n.nextHopProtocol || "不明") + "   ← h3=HTTP/3(UDP) h2=HTTP/2(TCP)");
    lines.push("DNS 解決      : " + ms(n.domainLookupEnd - n.domainLookupStart));
    lines.push("TCP 接続      : " + ms(n.connectEnd - n.connectStart));
    lines.push("TLS 確立      : " + (n.secureConnectionStart ? ms(n.connectEnd - n.secureConnectionStart) : "-"));
    lines.push("最初の1byte   : " + ms(n.responseStart - n.requestStart) + "   ← サーバーの応答の速さ");
    lines.push("本体の受信    : " + ms(n.responseEnd - n.responseStart));
    lines.push("表示できるまで: " + ms(n.domContentLoadedEventEnd));
    lines.push("読み込み完了  : " + ms(n.loadEventEnd));
    lines.push("転送量        : " + kb(n.transferSize));
    var p = performance.getEntriesByType("paint");
    for (var i = 0; i < p.length; i++) {
      if (p[i].name === "first-contentful-paint") lines.push("最初の描画    : " + ms(p[i].startTime));
    }
    lines.push("");
    lines.push("端末: " + navigator.userAgent);
    if (navigator.connection) {
      lines.push("回線: " + (navigator.connection.effectiveType || "?") +
        " / 推定" + (navigator.connection.downlink || "?") + "Mbps" +
        " / RTT" + (navigator.connection.rtt || "?") + "ms");
    }
    return lines.join("\n");
  }

  document.getElementById("self").textContent = selfReport();

  // --- 各ページを実際に取りに行って測る ---
  var TARGETS = [
    ["ホーム", "/"],
    ["ガイド", "/guide/"],
    ["リファレンス", "/ref/"],
    ["スケール", "/scale/"],
    ["REFのデータJS", "/ref/strudel-ref-data.js"],
    ["フォントCSS", "/narucode-fonts.css"],
    ["フォント本体", "/fonts/inter-latin.woff2"],
    ["アイコンJS", "/narucode-icons.js"],
  ];

  var out = document.getElementById("out");
  var run = document.getElementById("run");

  function timeOne(label, path) {
    // キャッシュを避けて、実際に取りに行った時間を測る
    var url = path + (path.indexOf("?") < 0 ? "?" : "&") + "_d=" + Date.now() + Math.random();
    var t0 = performance.now();
    var firstByte = null;
    return fetch(url, { cache: "no-store" })
      .then(function (res) {
        firstByte = performance.now() - t0;
        return res.arrayBuffer().then(function (buf) {
          var total = performance.now() - t0;
          return { label: label, path: path, status: res.status, firstByte: firstByte, total: total, bytes: buf.byteLength };
        });
      })
      .catch(function (e) {
        return { label: label, path: path, error: String(e && e.message || e), total: performance.now() - t0 };
      });
  }

  run.addEventListener("click", function () {
    run.disabled = true;
    run.textContent = "計測中…";
    var lines = ["== 各ページを実際に取得した時間 ==", ""];
    out.textContent = "計測中…";

    var i = 0;
    var worst = 0;
    function next() {
      if (i >= TARGETS.length) {
        lines.push("");
        lines.push("一番遅かったもの: " + Math.round(worst) + "ms");
        lines.push("計測時刻: " + new Date().toString());
        out.textContent = lines.join("\n");
        run.textContent = "もう一度計測する";
        run.disabled = false;
        return;
      }
      var t = TARGETS[i++];
      timeOne(t[0], t[1]).then(function (r) {
        if (r.error) {
          lines.push(r.label + " : 失敗 " + r.error + " (" + Math.round(r.total) + "ms)");
        } else {
          if (r.total > worst) worst = r.total;
          lines.push(
            pad(r.label, 14) + " " + String(r.status) +
            "  最初の1byte " + pad(Math.round(r.firstByte) + "ms", 8) +
            " 全部で " + pad(Math.round(r.total) + "ms", 8) +
            " " + kb(r.bytes)
          );
        }
        out.textContent = lines.join("\n") + "\n…";
        next();
      });
    }
    function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }
    next();
  });

  // --- 描画コストの実測 ---
  // ホームの CSS と同じ値で、ぼかし要素を実際に描いてフレーム時間を測る。
  // ネットワークが速いのに表示が遅い場合、ここに時間が消えている。
  var paintOut = document.getElementById("paint");
  var runPaint = document.getElementById("runpaint");

  function measureFrames(frames) {
    // 何もしない状態で rAF を回し、1フレームにかかる時間を測る
    return new Promise(function (resolve) {
      var times = [];
      var last = performance.now();
      var n = 0;
      // 実際に合成が走るように、毎フレーム微小に動かす
      var probe = document.createElement("div");
      probe.style.cssText = "position:fixed;top:0;left:0;width:8px;height:8px;opacity:0.01;pointer-events:none;z-index:9999";
      document.body.appendChild(probe);
      function tick(now) {
        times.push(now - last);
        last = now;
        probe.style.transform = "translateX(" + (n % 20) + "px)";
        if (++n < frames) requestAnimationFrame(tick);
        else {
          probe.remove();
          times.sort(function (a, b) { return a - b; });
          var sum = 0;
          for (var i = 0; i < times.length; i++) sum += times[i];
          resolve({
            avg: sum / times.length,
            median: times[Math.floor(times.length / 2)],
            worst: times[times.length - 1],
          });
        }
      }
      requestAnimationFrame(function (t) { last = t; requestAnimationFrame(tick); });
    });
  }

  function makeBlurLayer() {
    // ホームの実際の値をそのまま使う
    var wrap = document.createElement("div");
    wrap.id = "__blurtest";
    wrap.innerHTML =
      '<div style="position:fixed;z-index:0;border-radius:999px;pointer-events:none;filter:blur(150px);' +
      'top:-128px;right:-96px;width:416px;height:416px;background:#2f56ff;opacity:0.45"></div>' +
      '<div style="position:fixed;z-index:0;border-radius:999px;pointer-events:none;filter:blur(150px);' +
      'bottom:-160px;left:-128px;width:448px;height:448px;background:#0a1580;opacity:0.60"></div>' +
      '<div style="position:fixed;top:0;left:0;right:0;height:56px;z-index:20;' +
      'border-bottom:1px solid rgba(255,255,255,0.15);background:rgba(11,28,174,0.92);' +
      '-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)"></div>';
    return wrap;
  }

  runPaint.addEventListener("click", function () {
    runPaint.disabled = true;
    runPaint.textContent = "測定中…";
    var lines = ["== 描画コストの実測 ==", ""];
    var before, after, insertMs;
    paintOut.textContent = "① ぼかし無しの状態を測定中…";

    measureFrames(70).then(function (b) {
      before = b;
      paintOut.textContent = "② ぼかしを表示して測定中…";
      var layer = makeBlurLayer();
      var t0 = performance.now();
      document.body.appendChild(layer);
      // 最初の1フレームが出るまで＝初回描画のコスト
      return new Promise(function (res) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            insertMs = performance.now() - t0;
            res();
          });
        });
      });
    }).then(function () {
      return measureFrames(70);
    }).then(function (a) {
      after = a;
      var layer = document.getElementById("__blurtest");
      if (layer) layer.remove();

      var f = function (v) { return v.toFixed(1) + "ms"; };
      lines.push("ぼかし無し : 平均 " + f(before.avg) + " / 中央 " + f(before.median) + " / 最悪 " + f(before.worst));
      lines.push("ぼかし有り : 平均 " + f(after.avg) + " / 中央 " + f(after.median) + " / 最悪 " + f(after.worst));
      lines.push("ぼかしを出してから最初の描画まで: " + f(insertMs));
      lines.push("");
      var ratio = before.avg > 0 ? after.avg / before.avg : 0;
      lines.push("倍率: " + ratio.toFixed(1) + "倍   ← 1.0 に近ければぼかしは無罪");
      lines.push("(60fps なら 16.7ms が1フレーム。数値が大きいほど描画が詰まっている)");
      var verdict;
      if (ratio >= 3 || after.avg > 60) verdict = "判定: ぼかしが極端に重い ← これが原因の可能性が高い";
      else if (ratio >= 1.6 || after.avg > 33) verdict = "判定: ぼかしはそれなりに重い";
      else verdict = "判定: ぼかしは重くない ← 別の原因を探す必要がある";
      lines.push(verdict);

      paintOut.textContent = lines.join("\n");
      runPaint.textContent = "もう一度測る";
      runPaint.disabled = false;
    }).catch(function (e) {
      paintOut.textContent = "測定失敗: " + (e && e.message || e);
      runPaint.textContent = "もう一度測る";
      runPaint.disabled = false;
    });
  });

  document.getElementById("copy").addEventListener("click", function () {
    var text = document.getElementById("self").textContent + "\n\n" + out.textContent + "\n\n" + document.getElementById("paint").textContent;
    var btn = this;
    function done() { btn.textContent = "コピーした"; setTimeout(function () { btn.textContent = "結果を全部コピー"; }, 1800); }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "コピーできず。長押しで選択して"; }
      document.body.removeChild(ta);
    }
  });
})();
</script>

</body>
</html>
